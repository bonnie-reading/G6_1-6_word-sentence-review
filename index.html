<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>國語六上 1-6 課 闖關學習樂園</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome 圖示 -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <!-- Google 字體 -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Noto Sans TC"', 'sans-serif'],
          },
          colors: {
            brand: {
              cream: '#FFFDF9',
              yellow: '#FDE047',
              orange: '#FB923C',
              mint: '#34D399',
              blue: '#60A5FA',
              purple: '#A78BFA',
              coral: '#F87171',
              dark: '#1E293B',
            }
          }
        }
      }
    }
  </script>

  <style>
    /* 翻轉卡片 3D 效果 */
    .perspective-1000 {
      perspective: 1000px;
    }
    .transform-style-3d {
      transform-style: preserve-3d;
    }
    .backface-hidden {
      backface-visibility: hidden;
    }
    .rotate-y-180 {
      transform: rotateY(180deg);
    }
    /* 自訂平滑過渡 */
    * {
      transition: background-color 0.2s, border-color 0.2s, transform 0.2s;
    }
    /* 彈跳星星動畫 */
    @keyframes star-pop {
      0% { transform: scale(0.8); }
      50% { transform: scale(1.3) rotate(15deg); }
      100% { transform: scale(1); }
    }
    .animate-star {
      animation: star-pop 0.5s ease-out;
    }
    /* 隱藏滾動條但保持滾動 */
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

</head>
<body class="bg-[#F8FAFC] text-slate-800 font-sans min-h-screen flex flex-col text-lg select-none">

  <!-- 頂部導航欄（特教輔助工具列） -->
  <header class="sticky top-0 z-40 bg-white/95 backdrop-blur-md shadow-sm border-b border-amber-100 px-4 py-3">
    <div class="max-w-6xl mx-auto flex flex-wrap items-center justify-between gap-3">
      <!-- 標題與吉祥物 -->
      <div class="flex items-center space-x-3 cursor-pointer" onclick="switchLesson(1)">
        <div class="w-12 h-12 bg-amber-100 rounded-2xl flex items-center justify-center text-3xl shadow-inner text-amber-600">
          🐱
        </div>
        <div>
          <h1 class="text-xl sm:text-2xl font-black text-slate-800 tracking-wide flex items-center gap-2">
            國語六上 闖關樂園
            <span class="text-xs bg-amber-400 text-slate-900 px-2 py-0.5 rounded-full font-bold">1-6課</span>
          </h1>
          <p class="text-xs text-slate-500 font-medium">看懂詞語、快樂造句、累積星星！</p>
        </div>
      </div>

      <!-- 右側輔助工具：星星計分、字級縮放、語音朗讀開關 -->
      <div class="flex items-center gap-2 sm:gap-3">
        <!-- 收集星星計數器 -->
        <div class="flex items-center bg-amber-50 border-2 border-amber-200 rounded-2xl px-3 py-1.5 shadow-sm">
          <i class="fa-solid fa-star text-amber-400 text-2xl mr-1.5 drop-shadow"></i>
          <span id="star-count" class="font-black text-amber-600 text-xl">0</span>
          <span class="text-xs text-amber-700 ml-1 font-bold">顆星</span>
        </div>

        <!-- 字體放大/縮小按鈕 -->
        <div class="flex items-center bg-slate-100 rounded-2xl p-1 border border-slate-200">
          <button onclick="changeFontSize(-1)" title="字體縮小" class="w-9 h-9 flex items-center justify-center font-bold text-slate-600 hover:bg-white rounded-xl shadow-xs active:scale-95">
            A-
          </button>
          <button onclick="changeFontSize(1)" title="字體放大" class="w-9 h-9 flex items-center justify-center font-black text-slate-800 hover:bg-white rounded-xl shadow-xs active:scale-95">
            A+
          </button>
        </div>

        <!-- 語音朗讀停止/提示按鈕 -->
        <button id="tts-stop-btn" onclick="stopSpeech()" class="h-10 px-3 bg-rose-50 text-rose-600 border border-rose-200 rounded-2xl flex items-center gap-1.5 text-sm font-bold hover:bg-rose-100 active:scale-95 transition-all">
          <i class="fa-solid fa-volume-xmark"></i>
          <span class="hidden sm:inline">安靜</span>
        </button>
      </div>
    </div>
  </header>

  <!-- 課程選單快捷列（水平滑動卡片） -->
  <section class="bg-gradient-to-r from-amber-50 via-orange-50 to-yellow-50 py-3 border-b border-orange-100">
    <div class="max-w-6xl mx-auto px-4">
      <div class="flex items-center gap-2 overflow-x-auto no-scrollbar py-1" id="lesson-tabs">
        <!-- 由 JavaScript 動態生成 6 課按鈕 -->
      </div>
    </div>
  </section>

  <!-- 主要互動內容區域 -->
  <main class="max-w-6xl mx-auto px-4 py-6 flex-1 w-full" id="content-container">

    <!-- 課次抬頭與大卡片 -->
    <div class="bg-white rounded-3xl p-5 sm:p-7 shadow-sm border border-slate-100 mb-6 flex flex-col md:flex-row md:items-center justify-between gap-4">
      <div class="flex items-start gap-4">
        <div id="lesson-icon" class="w-16 h-16 sm:w-20 sm:h-20 bg-amber-100 text-amber-700 rounded-3xl flex items-center justify-center text-4xl shadow-inner shrink-0">
          🏃
        </div>
        <div>
          <div class="flex items-center gap-2">
            <span id="lesson-badge" class="px-3 py-1 bg-amber-500 text-white text-xs sm:text-sm font-black rounded-full">第 1 課</span>
            <span class="text-xs text-slate-400 font-medium">國小國語六上</span>
          </div>
          <h2 id="lesson-title" class="text-2xl sm:text-3xl font-black text-slate-800 mt-1">
            跑道
          </h2>
          <p id="lesson-desc" class="text-sm sm:text-base text-slate-500 mt-1">
            學會運動場上的堅持與友情，把詞語當成闖關夥伴！
          </p>
        </div>
      </div>

      <!-- 朗讀整課主要圈詞 -->
      <div class="flex items-center gap-2">
        <button onclick="readCurrentLessonWords()" class="w-full md:w-auto px-4 py-3 bg-emerald-500 hover:bg-emerald-600 text-white font-bold rounded-2xl shadow-md shadow-emerald-200 flex items-center justify-center gap-2 active:scale-95 text-base">
          <i class="fa-solid fa-volume-high"></i>
          <span>朗讀本課全部詞語</span>
        </button>
      </div>
    </div>

    <!-- 模組功能切換分頁標籤（詞語探險 / 句型積木 / 星星小挑戰） -->
    <div class="flex border-b-2 border-slate-200 mb-6 gap-2 sm:gap-6 text-base sm:text-xl font-black">
      <button onclick="switchTab('vocab')" id="tab-vocab" class="tab-btn pb-3 px-3 text-amber-600 border-b-4 border-amber-500 flex items-center gap-2">
        <span>📖 詞語探險卡片</span>
        <span id="vocab-count-badge" class="text-xs bg-amber-100 text-amber-700 px-2 py-0.5 rounded-full font-bold">19個</span>
      </button>
      <button onclick="switchTab('sentence')" id="tab-sentence" class="tab-btn pb-3 px-3 text-slate-400 hover:text-slate-600 border-b-4 border-transparent flex items-center gap-2">
        <span>🧩 句型積木拼圖</span>
      </button>
      <button onclick="switchTab('quiz')" id="tab-quiz" class="tab-btn pb-3 px-3 text-slate-400 hover:text-slate-600 border-b-4 border-transparent flex items-center gap-2">
        <span>⭐ 星星小挑戰</span>
      </button>
    </div>

    <section id="module-vocab" class="block">

    </section>

    <section id="module-sentence" class="hidden">

        <!-- 句型卡片由 JS 動態生成 -->
      </div>
    </section>

    <!-- 模組 C：星星小挑戰（快問快答） -->
    <section id="module-quiz" class="hidden">
      <div class="bg-white rounded-3xl p-6 sm:p-8 shadow-sm border border-slate-100 max-w-3xl mx-auto">

            <span class="text-xs font-bold uppercase tracking-wider text-amber-600 bg-amber-50 px-2.5 py-1 rounded-full">快問快答</span>
            <h3 class="text-xl sm:text-2xl font-black text-slate-800 mt-1">看情境選詞語</h3>
          </div>
          <div class="text-right">
            <span id="quiz-progress-text" class="text-sm font-bold text-slate-400">第 1 / 3 題</span>
            <div class="w-24 sm:w-32 bg-slate-100 h-2.5 rounded-full mt-1 overflow-hidden">
              <div id="quiz-progress-bar" class="bg-amber-500 h-full w-1/3 transition-all"></div>
            </div>
          </div>
        </div>

        <!-- 題目內容 -->
        <div id="quiz-box">
          <!-- 由 JS 繪製測驗題目 -->
        </div>

        <!-- 答題反饋訊息 -->
        <div id="quiz-feedback" class="mt-6 p-4 rounded-2xl hidden flex items-center gap-3">
          <!-- 綠色或紅色提示 -->
        </div>

        <!-- 下一題按鈕 -->
        <div class="mt-6 text-right">
          <button id="quiz-next-btn" onclick="nextQuizQuestion()" class="hidden px-6 py-3 bg-amber-500 hover:bg-amber-600 text-slate-900 font-black rounded-2xl shadow-md active:scale-95 transition-all text-base">

        </div>
      </div>
    </section>

  </main>

  <!-- 成功通關彈窗 / 鼓勵視窗 -->

      <p id="congrats-msg" class="text-slate-600 mb-6 text-base">

      <div class="flex gap-3">
        <button onclick="closeCongratsModal()" class="flex-1 py-3 bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold rounded-2xl">

        </button>
        <button onclick="goToNextLesson()" class="flex-1 py-3 bg-amber-500 hover:bg-amber-600 text-slate-900 font-black rounded-2xl shadow-md">
          前進下一課 🚀
        </button>
      </div>
    </div>
  </div>

    <div class="max-w-4xl mx-auto px-4">

  </footer>

    // 音效合成器 (Web Audio API)
    let audioCtx = null;
    function playTone(freq, type = 'sine', duration = 0.15) {
      try {
        if (!audioCtx) {
          audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (audioCtx.state === 'suspended') {
          audioCtx.resume();
        }
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      } catch (e) {
        console.warn("音效播放失敗", e);
      }
    }

    function playSuccessSound() {
      playTone(523.25, 'triangle', 0.12); // C5
      setTimeout(() => playTone(659.25, 'triangle', 0.12), 100); // E5
      setTimeout(() => playTone(783.99, 'triangle', 0.25), 200); // G5
    }

    function playEncourageSound() {
      playTone(392.00, 'sine', 0.15);
      setTimeout(() => playTone(329.63, 'sine', 0.2), 150);
    }

    /* ==========================================================================
       3. 語音朗讀合成 (Web Speech API)
       ========================================================================== */
    function speakText(text) {
      if (!('speechSynthesis' in window)) {
        return;
      }
      window.speechSynthesis.cancel(); // 停止先前的朗讀
      const utter = new SpeechSynthesisUtterance(text);
      utter.lang = 'zh-TW';
      utter.rate = 0.85; // 特教友善：語速放緩，咬字清楚
      utter.pitch = 1.05; // 稍稍親切的高音頻
      window.speechSynthesis.speak(utter);
    }

    function stopSpeech() {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
      }
    }

    // 高亮句型關鍵詞（如：是、也是、與其、不如）
    function highlightSentence(sentence, pattern) {
      let result = sentence;
      const cleanPattern = pattern.replace(/[【】]/g, '');
      const parts = cleanPattern.split('……').map(p => p.trim()).filter(p => p.length > 0);
      parts.forEach(part => {
        const reg = new RegExp(part, 'g');
        result = result.replace(reg, `<span class="bg-amber-200 text-amber-900 px-1 py-0.5 rounded font-black">${part}</span>`);
      });
      return result;
    }

    // 積木重組初始化
    function initPuzzleBlocks() {
      const lesson = lessonsData.find(l => l.id === currentLessonId);
      userSentencePicks = [];
      const pool = document.getElementById('puzzle-pool');
      const dropzone = document.getElementById('puzzle-dropzone');
      const placeholder = document.getElementById('dropzone-placeholder');
      const feedback = document.getElementById('puzzle-feedback');

      pool.innerHTML = '';
      dropzone.innerHTML = '';
      dropzone.appendChild(placeholder);
      placeholder.style.display = 'block';
      feedback.innerHTML = '';

      // 隨機打亂積木
      const shuffled = [...lesson.sentence.options].sort(() => Math.random() - 0.5);

      shuffled.forEach((text, i) => {
        const btn = document.createElement('button');
        btn.id = `block-opt-${i}`;
        btn.className = 'px-4 py-2.5 bg-amber-100 hover:bg-amber-200 text-amber-900 border-2 border-amber-300 font-black rounded-2xl text-base shadow-xs active:scale-95 transition-all';
        btn.innerText = text;
        btn.onclick = () => pickBlock(text, btn);
        pool.appendChild(btn);
      });
    }

    function pickBlock(text, btnElement) {
      playTone(500, 'triangle', 0.1);
      userSentencePicks.push(text);
      btnElement.style.visibility = 'hidden';

      const dropzone = document.getElementById('puzzle-dropzone');
      const placeholder = document.getElementById('dropzone-placeholder');
      placeholder.style.display = 'none';

      const placedChip = document.createElement('div');
      placedChip.className = 'px-4 py-2 bg-emerald-500 text-white font-black rounded-2xl shadow-sm text-base flex items-center gap-2 animate-star';
      placedChip.innerHTML = `
        <span>${text}</span>
        <i class="fa-solid fa-circle-xmark text-xs opacity-70 hover:opacity-100 cursor-pointer"></i>
      `;

      placedChip.onclick = () => {
        // 點選移除積木
        playTone(350, 'sine', 0.08);
        const idx = userSentencePicks.lastIndexOf(text);
        if (idx !== -1) userSentencePicks.splice(idx, 1);
        btnElement.style.visibility = 'visible';
        placedChip.remove();
        if (userSentencePicks.length === 0) {
          placeholder.style.display = 'block';
        }
      };

      dropzone.appendChild(placedChip);
    }

    function resetPuzzle() {
      initPuzzleBlocks();
    }

    function checkPuzzleAnswer() {
      const lesson = lessonsData.find(l => l.id === currentLessonId);
      const target = lesson.sentence.correctOrder.join('');
      const user = userSentencePicks.join('');
      const feedback = document.getElementById('puzzle-feedback');

      if (userSentencePicks.length === 0) {
        feedback.innerHTML = `<span class="text-rose-500">先點選積木排排看喔！</span>`;
        return;
      }

      if (user === target) {
        playSuccessSound();
        addStars(1);
        feedback.innerHTML = `
          <span class="text-emerald-600 font-black flex items-center gap-1.5 animate-bounce">
            <i class="fa-solid fa-circle-check text-xl"></i> 太棒了！拼得完全正確！獲得 1 顆星星 ⭐
          </span>
        `;
        speakText("太棒了！句型積木拼得完全正確！");
      } else {
        playEncourageSound();
        feedback.innerHTML = `
          <span class="text-amber-600 font-bold flex items-center gap-1.5">
            <i class="fa-solid fa-circle-info text-xl"></i> 還差一點點喔！再試著調整一下順序看看！
          </span>
        `;
      }
    }

    /* ==========================================================================
       7. 模組 C：星星小挑戰（快問快答）
       ========================================================================== */
    function renderQuizQuestion() {
      const lesson = lessonsData.find(l => l.id === currentLessonId);
      const q = lesson.quiz[currentQuizIndex];
      const box = document.getElementById('quiz-box');
      const progressText = document.getElementById('quiz-progress-text');
      const progressBar = document.getElementById('quiz-progress-bar');
      const feedback = document.getElementById('quiz-feedback');
      const nextBtn = document.getElementById('quiz-next-btn');

      // 更新進度條
      progressText.innerText = `第 ${currentQuizIndex + 1} / ${lesson.quiz.length} 題`;
      progressBar.style.width = `${((currentQuizIndex + 1) / lesson.quiz.length) * 100}%`;

      feedback.className = 'mt-6 p-4 rounded-2xl hidden flex items-center gap-3';
      nextBtn.classList.add('hidden');

      box.innerHTML = `
        <div class="mb-6">
          <div class="flex items-start gap-3">
            <div class="w-10 h-10 rounded-2xl bg-amber-100 text-amber-700 flex items-center justify-center font-black text-xl shrink-0 mt-1">
              Q
            </div>
            <div>
              <p class="text-lg sm:text-2xl font-black text-slate-800 leading-relaxed">
                ${q.question}
              </p>
              <button onclick="speakText('${q.question}')" class="mt-2 text-xs text-amber-600 font-bold hover:underline flex items-center gap-1">
                <i class="fa-solid fa-volume-high"></i> 朗讀題目
              </button>
            </div>
          </div>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-3 gap-3.5 mt-6" id="quiz-options-container">
          <!-- 題目選項按鈕 -->
        </div>
      `;

      const optContainer = document.getElementById('quiz-options-container');
      q.options.forEach((opt, idx) => {
        const btn = document.createElement('button');
        btn.id = `quiz-opt-btn-${idx}`;
        btn.className = 'py-4 px-4 bg-slate-50 hover:bg-amber-50 border-2 border-slate-200 hover:border-amber-400 rounded-2xl text-lg sm:text-xl font-black text-slate-800 shadow-sm active:scale-95 transition-all text-center';
        btn.innerText = opt;
        btn.onclick = () => handleQuizAnswer(idx, q.answer, q.explain);
        optContainer.appendChild(btn);
      });
    }

    function handleQuizAnswer(selectedIdx, correctIdx, explanation) {
      const lesson = lessonsData.find(l => l.id === currentLessonId);
      const feedback = document.getElementById('quiz-feedback');
      const nextBtn = document.getElementById('quiz-next-btn');
      
      // 禁用所有按鈕防止重複點擊
      lesson.quiz[currentQuizIndex].options.forEach((_, i) => {
        const b = document.getElementById(`quiz-opt-btn-${i}`);
        b.disabled = true;
      });

      const selectedBtn = document.getElementById(`quiz-opt-btn-${selectedIdx}`);

      if (selectedIdx === correctIdx) {
        playSuccessSound();
        addStars(1);
        quizScoreCurrentLesson++;

        selectedBtn.classList.remove('bg-slate-50', 'border-slate-200');
        selectedBtn.classList.add('bg-emerald-500', 'border-emerald-600', 'text-white', 'shadow-md');

        feedback.classList.remove('hidden', 'bg-rose-50', 'text-rose-800', 'border-rose-200');
        feedback.classList.add('bg-emerald-50', 'text-emerald-900', 'border', 'border-emerald-200');
        feedback.innerHTML = `
          <div class="text-3xl">🎉</div>
          <div>
            <div class="font-black text-base">答對了！太厲害了！</div>
            <div class="text-sm text-emerald-800">${explanation}</div>
          </div>
        `;
        speakText(`答對了！${explanation}`);
      } else {
        playEncourageSound();
        selectedBtn.classList.remove('bg-slate-50', 'border-slate-200');
        selectedBtn.classList.add('bg-rose-100', 'border-rose-400', 'text-rose-800');

        const correctBtn = document.getElementById(`quiz-opt-btn-${correctIdx}`);
        correctBtn.classList.remove('bg-slate-50');
        correctBtn.classList.add('bg-emerald-100', 'border-emerald-400', 'text-emerald-900');

        feedback.classList.remove('hidden', 'bg-emerald-50', 'text-emerald-900', 'border-emerald-200');
        feedback.classList.add('bg-amber-50', 'text-amber-900', 'border', 'border-amber-200');
        feedback.innerHTML = `
          <div class="text-3xl">💪</div>
          <div>
            <div class="font-black text-base">差一點點！正確答案是「${lesson.quiz[currentQuizIndex].options[correctIdx]}」</div>
            <div class="text-sm text-amber-800">${explanation}</div>
          </div>
        `;
        speakText(`沒關係！正確答案是：${lesson.quiz[currentQuizIndex].options[correctIdx]}。${explanation}`);
      }

      nextBtn.classList.remove('hidden');
      if (currentQuizIndex === lesson.quiz.length - 1) {
        nextBtn.innerHTML = `查看通關獎勵 🏆`;
      } else {
        nextBtn.innerHTML = `下一題 ➔`;
      }
    }

    function nextQuizQuestion() {
      const lesson = lessonsData.find(l => l.id === currentLessonId);
      if (currentQuizIndex < lesson.quiz.length - 1) {
        currentQuizIndex++;
        renderQuizQuestion();
      } else {
        // 完成此課測驗
        openCongratsModal();
      }
    }

    /* ==========================================================================
       8. 星星計分與通關彈窗獎勵
       ========================================================================== */
    function addStars(num) {
      totalStars += num;
      const countEl = document.getElementById('star-count');
      countEl.innerText = totalStars;
      countEl.parentElement.classList.add('animate-star');
      setTimeout(() => {
        countEl.parentElement.classList.remove('animate-star');
      }, 600);
    }

    function openCongratsModal() {
      const modal = document.getElementById('congrats-modal');
      const lesson = lessonsData.find(l => l.id === currentLessonId);
      document.getElementById('congrats-msg').innerText = `你已經完成了第 ${lesson.id} 課《${lesson.title}》的學習挑戰，你的表現非常卓越！總共累積了 ${totalStars} 顆星星！`;
      modal.classList.remove('hidden');
      playSuccessSound();
      speakText(`恭喜你完成第 ${lesson.id} 課的挑戰，表現超級棒！`);
    }

    function closeCongratsModal() {
      document.getElementById('congrats-modal').classList.add('hidden');
      currentQuizIndex = 0;
      renderQuizQuestion();
    }

    function goToNextLesson() {
      document.getElementById('congrats-modal').classList.add('hidden');
      let nextId = currentLessonId + 1;
      if (nextId > lessonsData.length) {
        nextId = 1;
      }
      switchLesson(nextId);
    }

    /* ==========================================================================
       9. 特教友善字級縮放
       ========================================================================== */
    function changeFontSize(delta) {
      playTone(400, 'sine', 0.05);
      if (delta > 0 && fontSizeMultiplier < 1.35) {
        fontSizeMultiplier += 0.08;
      } else if (delta < 0 && fontSizeMultiplier > 0.9) {
        fontSizeMultiplier -= 0.08;
      }
      document.getElementById('content-container').style.fontSize = `${fontSizeMultiplier * 1.125}rem`;
    }

    /* ==========================================================================
       10. 頁面載入啟動
       ========================================================================== */
    window.onload = function() {
      renderLessonTabs();
      renderLessonHeader();
      renderVocabularies();
      renderSentenceSection();
      renderQuizQuestion();
    };
  </script>
</body>
</html>
